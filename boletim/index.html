<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Boletim Escolar 💖</title>

    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            text-align: center;
            margin: 0;
            padding: 0;
            color: #6a1b9a;
        }

        .container {
            margin-top: 50px;
        }

        h1 {
            font-size: 32px;
        }

        button {
            background: #ff69b4;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
        }

        button:hover {
            background: #ff1493;
            transform: scale(1.1);
        }

        #resultado {
            margin: 30px auto;
            width: 60%;
            background: rgba(255, 255, 255, 0.6);
            padding: 20px;
            border-radius: 20px;
            text-align: left;
            backdrop-filter: blur(5px);
        }

        .aluno {
            padding: 12px;
            margin: 10px 0;
            border-radius: 15px;
            background: rgba(255,255,255,0.7);
        }

        .excelente {
            border-left: 6px solid #ff00aa;
        }

        .bom {
            border-left: 6px solid #ff66cc;
        }

        .aprovado {
            border-left: 6px solid #ffb6c1;
        }

        .reprovado {
            border-left: 6px solid #ff4d6d;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>💖 Boletim Escolar 💖</h1>

        <button onclick="gerarBoletim()">✨ Gerar Boletim ✨</button>

        <div id="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
